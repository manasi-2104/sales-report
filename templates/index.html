<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAILY REPORT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="form-wrapper">

<section class="form-card header-card">
    <div class="gold-top"></div>
    <div class="header-content">
        <h1>DAILY REPORT</h1>
        <h2>Dear Team, Fill Your Report Daily!!</h2>
    </div>
    <div class="required-note"><span>*</span> Indicates required question</div>
</section>

<form action="/submit" method="POST" id="salesForm">

<section class="form-card">
    <label class="question-title" for="date">Date <span>*</span></label>
    <div class="field-hint">Date</div>
    <input class="date-input" type="date" id="date" name="date" required>
</section>

<section class="form-card">
    <fieldset>
        <legend class="question-title">Supervisor Name <span>*</span></legend>
        <label class="radio-row">
            <input type="radio" name="supervisor" value="Atish Thakur" required>
            <span>Atish Thakur</span>
        </label>
    </fieldset>
</section>

<section class="form-card">
    <fieldset>
        <legend class="question-title">Laber Name/Mobile Number <span>*</span></legend>
        {% for x in ["Yallpa", "Tushar", "Prakash"] %}
        <label class="radio-row">
            <input type="radio" name="promoter" value="{{ x }}" required>
            <span>{{ x }}</span>
        </label>
        {% endfor %}
    </fieldset>
</section>

<section class="form-card">
    <fieldset>
        <legend class="question-title">Company Name <span>*</span></legend>
        <label class="radio-row">
            <input type="radio" name="store" value="Wedding Ferniture" required>
            <span>Wedding Ferniture</span>
        </label>
    </fieldset>
</section>

<section class="form-card attendance-card">
    <fieldset>
        <legend class="question-title">Attendance <span>*</span></legend>
        <label class="radio-row attendance-p">
            <input type="radio" name="attendance" value="P" required>
            <span>P</span>
        </label>
        <label class="radio-row attendance-a">
            <input type="radio" name="attendance" value="A" required>
            <span>A</span>
        </label>
        <label class="radio-row attendance-wo">
            <input type="radio" name="attendance" value="WO" required>
            <span>WO</span>
        </label>
    </fieldset>
</section>

<section class="form-card">
    <fieldset>
        <legend class="question-title">Shift</legend>
        <label class="radio-row">
            <input type="radio" name="shift" value="MORNING">
            <span>MORNING</span>
        </label>
        <label class="radio-row">
            <input type="radio" name="shift" value="AFTERNOON">
            <span>AFTERNOON</span>
        </label>
    </fieldset>
</section>

<div class="button-area">
    <button type="submit" class="submit-btn">Submit</button>
    <button type="reset" class="clear-btn">Clear form</button>
</div>

</form>
</div>

<script>
document.getElementById("salesForm").addEventListener("submit", function () {
    const b = document.querySelector(".submit-btn");
    b.disabled = true;
    b.textContent = "Submitting...";
});
</script>
</body>
</html>
